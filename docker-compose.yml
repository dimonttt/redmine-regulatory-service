services:
  redmine_db:
    image: postgres:16
    environment:
      POSTGRES_USER: redmine
      POSTGRES_PASSWORD: redmine
      POSTGRES_DB: redmine
    volumes:
      - redmine_db_data:/var/lib/postgresql/data

  redmine:
    image: redmine:6
    ports:
      - "3000:3000"
    environment:
      REDMINE_DB_POSTGRES: redmine_db
      REDMINE_DB_USERNAME: redmine
      REDMINE_DB_PASSWORD: redmine
    depends_on:
      - redmine_db

  app_db:
    image: postgres:16
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: redmine_service
    ports:
      - "5433:5432"
    volumes:
      - app_db_data:/var/lib/postgresql/data

volumes:
  redmine_db_data:
  app_db_data: