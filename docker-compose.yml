services:
  # База данных для сервиса
  app_db:
    image: postgres:16
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: redmine_service
    ports:
      - "5433:5432"
    volumes:
      - app_db_data:/var/lib/postgresql/data

  # Бэкенд (FastAPI)
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - APP_DB_HOST=app_db
      - APP_DB_PORT=5432
      - APP_DB_NAME=redmine_service
      - APP_DB_USER=app
      - APP_DB_PASSWORD=app
      - REDMINE_URL=http://host.docker.internal:3000
      - REDMINE_API_KEY=${REDMINE_API_KEY}
      - SECRET_KEY=${SECRET_KEY}
      - LLM_BASE_URL=http://host.docker.internal:11434/v1
      - LLM_MODEL=${LLM_MODEL}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin12345}
    depends_on:
      - app_db
    volumes:
      - .:/app

  # Фронтенд (Vue)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  app_db_data: